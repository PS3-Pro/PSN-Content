name: Update Game Metadata Index
on:
  workflow_call:
    inputs:
      database_update:
        type: boolean
        default: false
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: game-metadata-index
  cancel-in-progress: false
jobs:
  index:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: |
            .cache/game-metadata/*.json.gz
            .cache/game-metadata/cadence.txt
          key: game-metadata-v3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            game-metadata-v3-
            game-metadata-v2-
            game-metadata-v1-
      - name: Check catalog changes or weekly refresh
        id: cadence
        env:
          EVENT_NAME: ${{ inputs.database_update && 'database_update' || github.event_name }}
        run: |
          fingerprint=$(git ls-tree -r HEAD -- resources/database/content/official/games.tsv resources/database/content/official/pending/games.tsv resources/database/content/official/demos.tsv resources/database/content/official/pending/demos.tsv resources/database/content/external/nostalgia_vault.tsv resources/database/launchbox files/website/modern.html .github/scripts/update_game_metadata.py .github/scripts/generate_franchises.py | sha256sum | cut -d ' ' -f1)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          current=missing
          if [ -f resources/database/helpers/game-metadata.json ]; then
            current=$(sha256sum resources/database/helpers/game-metadata.json | cut -d ' ' -f1)
          fi
          marker=.cache/game-metadata/cadence.txt
          previous_fingerprint= previous_hash= previous_day=
          if [ -f "$marker" ]; then
            read -r previous_fingerprint previous_hash previous_day < "$marker" || true
          fi
          today=$(date -u +%F)
          weekly=false
          if [ "$EVENT_NAME" = schedule ] || [ "$(date -u +%u)" = 7 ]; then
            if [ "$previous_day" != "$today" ]; then weekly=true; fi
          fi
          if [ "$EVENT_NAME" = workflow_dispatch ] || [ "$weekly" = true ] || [ "$current" = missing ] || [ "$previous_fingerprint $previous_hash" != "$fingerprint $current" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'Catalog and published index unchanged; next weekly refresh remains scheduled.'
          fi
      - uses: actions/setup-python@v6
        if: steps.cadence.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Build catalog metadata and coverage report
        if: steps.cadence.outputs.run == 'true'
        env:
          CATALOG_FINGERPRINT: ${{ steps.cadence.outputs.fingerprint }}
        run: |
          python .github/scripts/update_game_metadata.py
          index_hash=$(sha256sum resources/database/helpers/game-metadata.json | cut -d ' ' -f1)
          mkdir -p .cache/game-metadata
          printf '%s %s %s\n' "$CATALOG_FINGERPRINT" "$index_hash" "$(date -u +%F)" > .cache/game-metadata/cadence.tmp
          mv .cache/game-metadata/cadence.tmp .cache/game-metadata/cadence.txt
      - uses: actions/cache/save@v5
        continue-on-error: true
        if: always() && steps.cadence.outputs.run == 'true' && hashFiles('.cache/game-metadata/*.json.gz') != ''
        with:
          path: |
            .cache/game-metadata/*.json.gz
            .cache/game-metadata/cadence.txt
          key: game-metadata-v3-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish index only
        id: publish
        if: steps.cadence.outputs.run == 'true'
        run: |
          git add resources/database/helpers/game-metadata.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'PS3-Pro Bot'
          git config user.email 'bot@ps3pro.com'
          git commit -m 'Auto-update: game metadata index'
          published=false
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              published=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 3))"
              if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
                git fetch --unshallow origin main || exit 1
              else
                git fetch origin main || exit 1
              fi
              git rebase FETCH_HEAD || exit 1
            fi
          done
          if [ "$published" != true ]; then exit 1; fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Request GitHub Pages build
        if: ${{ !inputs.database_update && steps.publish.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"; then
            echo '::warning::Changes committed; Pages build could not be requested.'
          fi
