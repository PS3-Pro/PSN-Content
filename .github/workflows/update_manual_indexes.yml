name: Update Manual Indexes

on:
  workflow_call:
    inputs:
      database_update:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: ps3-manual-index
  cancel-in-progress: false

jobs:
  update-manuals:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore unified manual cache
        id: restore
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: .cache/manual-index/
          key: manuals-unified-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: manuals-unified-v2-
      - name: Restore legacy PS3 scan state
        if: steps.restore.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: .cache/ps3-manual-index/state.json
          key: ps3-manuals-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ps3-manuals-v2-
      - name: Record restored manual cache state
        id: cache_before
        run: |
          cache=.cache/manual-index/metadata.json.gz
          if [ -f "$cache" ]; then
            echo "digest=$(sha256sum "$cache" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          fi
      - name: Index public game manuals
        id: index
        shell: bash
        run: |
          set +e
          python -u .github/scripts/build-manual-index.py resources/database/manuals 2>&1 | tee "$RUNNER_TEMP/manual-refresh.log"
          status=("${PIPESTATUS[@]}")
          set -e
          if [ "${status[1]}" != 0 ]; then exit "${status[1]}"; fi
          echo "exit_code=${status[0]}" >> "$GITHUB_OUTPUT"
      - name: Summarize manual refresh
        if: ${{ !cancelled() && steps.index.outcome != 'skipped' }}
        run: |
          echo '## Manual refresh' >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/manual-refresh.log" ]; then
            sed -nE '/^::warning::|^Manual refresh|^Incomplete manual refresh|^Metadata cache:|^PS3:|^ps[[:alnum:]]+: [0-9]+ titles/p' "$RUNNER_TEMP/manual-refresh.log" | sed 's/^::warning::/Warning: /' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Commit and push validated indexes
        id: publish
        run: |
          for platform in ps1 ps2 ps3 ps4 psp psvita; do
            index="resources/database/manuals/$platform.json"
            if [ -f "$index" ]; then git add -- "$index"; fi
          done
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'PS3-Pro Bot'
          git config user.email 'bot@ps3pro.com'
          git commit -m 'Auto-update: game manuals index'
          published=false
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              published=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 3))"
              if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
                git fetch --unshallow origin main || exit 1
              else
                git fetch origin main || exit 1
              fi
              git rebase FETCH_HEAD || exit 1
            fi
          done
          if [ "$published" != true ]; then exit 1; fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Detect manual cache changes
        id: cache_after
        if: ${{ !cancelled() && steps.cache_before.outcome == 'success' }}
        env:
          PREVIOUS: ${{ steps.cache_before.outputs.digest }}
        run: |
          cache=.cache/manual-index/metadata.json.gz
          if [ -f "$cache" ] && [ "$(sha256sum "$cache" | cut -d ' ' -f1)" != "$PREVIOUS" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Save unified manual cache
        if: ${{ !cancelled() && steps.cache_after.outputs.changed == 'true' }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: .cache/manual-index/
          key: manuals-unified-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Request GitHub Pages build
        if: ${{ !inputs.database_update && (steps.publish.outputs.changed == 'true' || github.event_name == 'workflow_dispatch') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"; then
            echo '::warning::Indexes committed; Pages build could not be requested.'
          fi
      - name: Report incomplete refresh
        if: ${{ !cancelled() && steps.index.outputs.exit_code != '' && steps.index.outputs.exit_code != '0' }}
        run: |
          echo '::error::Manual refresh failed for one or more platforms. See Index public game manuals and the job summary for the original error; validated indexes and cache were preserved where possible.'
          exit 1
