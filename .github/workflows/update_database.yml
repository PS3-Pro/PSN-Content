name: Update PSN™ Database

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  update-database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Sync NPS and Detect Changes
        run: |
          BASE_DIR="resources/database/content/official"
          LATEST_DIR="resources/database/content/latest"
          EVENTS_DIR="resources/database/content/events"
          HELPER_DIR="resources/database/helpers"
          PY_SCRIPT=".github/scripts/generate_latest_releases.py"

          clean_tsv() {
            awk -F'\t' '
              BEGIN { OFS = FS }
              function trim(value) {
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
                return value
              }
              NR == 1 {
                print
                next
              }

              {
                title_id = trim($1)
                name = trim($3)
                pkg_url = trim($4)
                if (title_id != "" &&
                    name != "" && toupper(name) != "MISSING" &&
                    pkg_url != "" && toupper(pkg_url) != "MISSING") {
                  print
                }
              }
            ' "$1" > "$2"
          }

          mkdir -p "$BASE_DIR/pending"
          mkdir -p "$LATEST_DIR"
          mkdir -p "$EVENTS_DIR/dlcs" "$EVENTS_DIR/avatars" "$EVENTS_DIR/themes"
          mkdir -p "$HELPER_DIR"

          categories=("games" "avatars" "demos" "dlcs" "themes")
          for cat in "${categories[@]}"; do
            echo "Processando $cat..."

            EVENT_DIR=""
            case "$cat" in
              dlcs|avatars|themes) EVENT_DIR="$EVENTS_DIR/$cat" ;;
            esac

            URL_OFFICIAL="https://nopaystation.com/tsv/PS3_${cat^^}.tsv"
            curl -L "$URL_OFFICIAL" -o "nps_raw.tsv"

            clean_tsv "nps_raw.tsv" "nps_clean.tsv"

            python "$PY_SCRIPT" "$BASE_DIR/${cat}.tsv" "nps_clean.tsv" "$LATEST_DIR/latest_${cat}.tsv" "$EVENT_DIR" "$cat" "official"
            mv "nps_clean.tsv" "$BASE_DIR/${cat}.tsv"
            rm "nps_raw.tsv"

            curl -L "https://nopaystation.com/tsv/pending/PS3_${cat^^}.tsv" -o "p_raw.tsv"
            clean_tsv "p_raw.tsv" "p_clean.tsv"

            python "$PY_SCRIPT" "$BASE_DIR/pending/${cat}.tsv" "p_clean.tsv" "$LATEST_DIR/latest_${cat}.tsv" "$EVENT_DIR" "$cat" "pending"
            mv "p_clean.tsv" "$BASE_DIR/pending/${cat}.tsv"
            rm "p_raw.tsv"
          done

          echo "Generating compact PS3 Classic child-content helper..."

          python - <<'PY'
          import csv
          from pathlib import Path

          base_dir = Path("resources/database/content/official")
          output = Path("resources/database/helpers/child_content_index.tsv")

          def clean_field(value):
              return str(value or "").replace("\t", " ").replace("\r", " ").replace("\n", " ").strip()

          def valid_title_id(value):
              value = clean_field(value).upper()
              return value if len(value) == 9 else ""

          def read_rows(path):
              with path.open("r", encoding="utf-8-sig", errors="replace", newline="") as handle:
                  for row in csv.reader(handle, delimiter="\t"):
                      yield row

          flags = {}
          license_candidates = []

          for row in read_rows(base_dir / "dlcs.tsv"):
              if not row:
                  continue

              title_id = valid_title_id(row[0])
              if not title_id:
                  continue

              flags.setdefault(title_id, set()).add("D")

              # Same compact data the Classic already extracts from dlcs.tsv
              # for its Missing Licenses matching.
              if len(row) < 6:
                  continue

              pkg_url = clean_field(row[3])
              if not pkg_url or pkg_url.upper() == "MISSING":
                  continue

              name = clean_field(row[2])
              content_id = clean_field(row[5])
              license_candidates.append((title_id, name, content_id))

          for filename, flag in (("avatars.tsv", "A"), ("themes.tsv", "T")):
              for row in read_rows(base_dir / filename):
                  if not row:
                      continue

                  title_id = valid_title_id(row[0])
                  if title_id:
                      flags.setdefault(title_id, set()).add(flag)

          output.parent.mkdir(parents=True, exist_ok=True)

          with output.open("w", encoding="utf-8", newline="\n") as handle:
              handle.write("# PS3 Classic child content index v1\n")
              handle.write("# I\\tTITLE_ID\\tFLAGS(D/A/T)\n")
              handle.write("# L\\tTITLE_ID\\tDLC_NAME\\tCONTENT_ID\n")

              for title_id in sorted(flags):
                  ordered_flags = "".join(flag for flag in "DAT" if flag in flags[title_id])
                  handle.write("I\t{}\t{}\n".format(title_id, ordered_flags))

              for title_id, name, content_id in license_candidates:
                  handle.write("L\t{}\t{}\t{}\n".format(title_id, name, content_id))

          print(
              "Generated {} | Title IDs: {} | DLC license candidates: {}".format(
                  output, len(flags), len(license_candidates)
              )
          )
          PY

          echo "Generating compact PS3 Classic base-game helper..."

          python - <<'PY'
          import csv
          from pathlib import Path

          base_dir = Path("resources/database/content/official")
          output = Path("resources/database/helpers/base_game_index.tsv")

          def clean_field(value):
              return str(value or "").replace("\t", " ").replace("\r", " ").replace("\n", " ").strip()

          def valid_title_id(value):
              value = clean_field(value).upper()
              return value if len(value) == 9 and value.isalnum() else ""

          def read_rows(path):
              if not path.exists():
                  return
              with path.open("r", encoding="utf-8-sig", errors="replace", newline="") as handle:
                  for row in csv.reader(handle, delimiter="\t"):
                      yield row

          child_ids = set()
          child_sources = [
              base_dir / "dlcs.tsv",
              base_dir / "pending" / "dlcs.tsv",
              base_dir / "avatars.tsv",
              base_dir / "pending" / "avatars.tsv",
              base_dir / "themes.tsv",
              base_dir / "pending" / "themes.tsv",
              base_dir / "game_updates.tsv",
          ]

          for path in child_sources:
              for row in read_rows(path) or ():
                  if not row:
                      continue
                  title_id = valid_title_id(row[0])
                  if title_id:
                      child_ids.add(title_id)

          records = []
          seen = set()

          # Keep name/content ID for Games so the Classic can apply its exact
          # existing Guide/Soundtrack/Video exclusions on the PS3.
          for path in (base_dir / "games.tsv", base_dir / "pending" / "games.tsv"):
              for row in read_rows(path) or ():
                  if not row:
                      continue
                  title_id = valid_title_id(row[0])
                  if not title_id or title_id not in child_ids:
                      continue
                  name = clean_field(row[2] if len(row) > 2 else "")
                  content_id = clean_field(row[5] if len(row) > 5 else "")
                  key = ("G", title_id, name, content_id)
                  if key not in seen:
                      seen.add(key)
                      records.append(key)

          # Preserve optional apps.tsv support from the legacy loader if those
          # files are ever present; absent files are simply ignored.
          for path in (base_dir / "apps.tsv", base_dir / "pending" / "apps.tsv"):
              for row in read_rows(path) or ():
                  if not row:
                      continue
                  title_id = valid_title_id(row[0])
                  if not title_id or title_id not in child_ids:
                      continue
                  key = ("A", title_id)
                  if key not in seen:
                      seen.add(key)
                      records.append(key)

          for path in (base_dir / "demos.tsv", base_dir / "pending" / "demos.tsv"):
              for row in read_rows(path) or ():
                  if not row:
                      continue
                  title_id = valid_title_id(row[0])
                  if not title_id or title_id not in child_ids:
                      continue
                  key = ("D", title_id)
                  if key not in seen:
                      seen.add(key)
                      records.append(key)

          output.parent.mkdir(parents=True, exist_ok=True)
          with output.open("w", encoding="utf-8", newline="\n") as handle:
              handle.write("# PS3 Classic base game index v1\n")
              handle.write("# G\\tTITLE_ID\\tNAME\\tCONTENT_ID\n")
              handle.write("# A\\tTITLE_ID\n")
              handle.write("# D\\tTITLE_ID\n")
              for record in records:
                  handle.write("\t".join(record) + "\n")

          print(
              "Generated {} | Child IDs: {} | Parent records: {}".format(
                  output, len(child_ids), len(records)
              )
          )
          PY

      - name: Commit and Push changes
        run: |
          git config --global user.name "PS3-Pro Bot"
          git config --global user.email "bot@ps3pro.com"
          git add resources/database/content/official/*.tsv
          git add resources/database/content/official/pending/*.tsv
          git add resources/database/content/latest/*.tsv
          git add resources/database/content/events
          git add resources/database/helpers/child_content_index.tsv
          git add resources/database/helpers/base_game_index.tsv

          git diff-index --quiet HEAD || git commit -m "Auto-update: Synchronized with NoPayStation (Official & Pending)"
          git push
