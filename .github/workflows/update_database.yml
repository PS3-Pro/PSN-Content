name: Update PSN™ Database

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  update-database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Sync NPS and Detect Changes
        run: |
          BASE_DIR="resources/database/content/official"
          LATEST_DIR="resources/database/content/latest"
          DLC_EVENTS_DIR="resources/database/content/events/dlcs"
          HELPER_DIR="resources/database/helpers"
          PY_SCRIPT=".github/scripts/generate_latest_releases.py"

          clean_tsv() {
            awk -F'\t' '
              BEGIN { OFS = FS }

              function trim(value) {
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
                return value
              }
              NR == 1 {
                print
                next
              }

              {
                title_id = trim($1)
                name = trim($3)
                pkg_url = trim($4)

                if (title_id != "" &&
                    name != "" && toupper(name) != "MISSING" &&
                    pkg_url != "" && toupper(pkg_url) != "MISSING") {
                  print
                }
              }
            ' "$1" > "$2"
          }
          mkdir -p "$BASE_DIR/pending"
          mkdir -p "$LATEST_DIR"
          mkdir -p "$DLC_EVENTS_DIR"
          mkdir -p "$HELPER_DIR"

          categories=("games" "avatars" "demos" "dlcs" "themes")

          for cat in "${categories[@]}"; do
            echo "Processando $cat..."

            URL_OFFICIAL="https://nopaystation.com/tsv/PS3_${cat^^}.tsv"
            curl -L "$URL_OFFICIAL" -o "nps_raw.tsv"

            clean_tsv "nps_raw.tsv" "nps_clean.tsv"

            python "$PY_SCRIPT" "$BASE_DIR/${cat}.tsv" "nps_clean.tsv" "$LATEST_DIR/latest_${cat}.tsv" "$DLC_EVENTS_DIR" "$cat" "official"
            mv "nps_clean.tsv" "$BASE_DIR/${cat}.tsv"
            rm "nps_raw.tsv"

            curl -L "https://nopaystation.com/tsv/pending/PS3_${cat^^}.tsv" -o "p_raw.tsv"
            clean_tsv "p_raw.tsv" "p_clean.tsv"

            python "$PY_SCRIPT" "$BASE_DIR/pending/${cat}.tsv" "p_clean.tsv" "$LATEST_DIR/latest_${cat}.tsv" "$DLC_EVENTS_DIR" "$cat" "pending"
            mv "p_clean.tsv" "$BASE_DIR/pending/${cat}.tsv"
            rm "p_raw.tsv"
          done

          echo "Generating compact PS3 Classic child-content helper..."

          python - <<'PY'
          import csv
          from pathlib import Path

          base_dir = Path("resources/database/content/official")
          helper_dir = Path("resources/database/helpers")
          output = helper_dir / "child_content_index.tsv"

          def clean_field(value):
              return str(value or "").replace("\t", " ").replace("\r", " ").replace("\n", " ").strip()

          def valid_title_id(value):
              value = clean_field(value).upper()
              return value if len(value) == 9 else ""

          def rows(path):
              with path.open("r", encoding="utf-8-sig", errors="replace", newline="") as handle:
                  for row in csv.reader(handle, delimiter="\t"):
                      yield row

          flags = {}
          license_candidates = []

          dlcs = base_dir / "dlcs.tsv"
          avatars = base_dir / "avatars.tsv"
          themes = base_dir / "themes.tsv"

          for row in rows(dlcs):
              if not row:
                  continue

              title_id = valid_title_id(row[0])
              if not title_id:
                  continue

              flags.setdefault(title_id, set()).add("D")

              if len(row) < 6:
                  continue

              pkg = clean_field(row[3])
              if not pkg or pkg.upper() == "MISSING":
                  continue

              name = clean_field(row[2])
              content_id = clean_field(row[5])
              license_candidates.append((title_id, name, content_id))

          for path, flag in ((avatars, "A"), (themes, "T")):
              for row in rows(path):
                  if not row:
                      continue

                  title_id = valid_title_id(row[0])
                  if title_id:
                      flags.setdefault(title_id, set()).add(flag)

          helper_dir.mkdir(parents=True, exist_ok=True)

          with output.open("w", encoding="utf-8", newline="\n") as handle:
              handle.write("# PS3 Classic child content index v1\n")
              handle.write("# I\\tTITLE_ID\\tFLAGS(D/A/T)\n")
              handle.write("# L\\tTITLE_ID\\tDLC_NAME\\tCONTENT_ID\n")

              for title_id in sorted(flags):
                  ordered_flags = "".join(flag for flag in "DAT" if flag in flags[title_id])
                  handle.write("I\t{}\t{}\n".format(title_id, ordered_flags))

              for title_id, name, content_id in license_candidates:
                  handle.write("L\t{}\t{}\t{}\n".format(title_id, name, content_id))

          print(
              "Generated {} | Title IDs: {} | DLC license candidates: {}".format(
                  output, len(flags), len(license_candidates)
              )
          )
          PY
      - name: Commit and Push changes
        run: |
          git config --global user.name "PS3-Pro Bot"
          git config --global user.email "bot@ps3pro.com"

          git add resources/database/content/official/*.tsv
          git add resources/database/content/official/pending/*.tsv
          git add resources/database/content/latest/*.tsv
          git add resources/database/content/events/dlcs
          git add resources/database/helpers/child_content_index.tsv

          git diff-index --quiet HEAD || git commit -m "Auto-update: Synchronized with NoPayStation (Official & Pending)"
          git push
