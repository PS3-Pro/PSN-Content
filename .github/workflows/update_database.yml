name: Update PSN™ Database

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-database-main
  cancel-in-progress: false

jobs:
  update-database:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Sync NPS and Detect Changes
        run: |
          BASE_DIR="resources/database/content/official"
          LATEST_DIR="resources/database/content/latest"
          EVENTS_DIR="resources/database/content/events"
          HELPER_DIR="resources/database/helpers"
          PY_SCRIPT=".github/scripts/generate_latest_releases.py"

          clean_tsv() {
            awk -F'\t' '
              BEGIN { OFS = FS }
              function trim(value) {
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
                return value
              }
              NR == 1 {
                print
                next
              }

              {
                title_id = trim($1)
                name = trim($3)
                pkg_url = trim($4)
                if (title_id != "" &&
                    name != "" && toupper(name) != "MISSING" &&
                    pkg_url != "" && toupper(pkg_url) != "MISSING") {
                  print
                }
              }
            ' "$1" > "$2"
          }

          validate_tsv() {
            python - "$1" "$2" "$3" <<'PY'
          import filecmp
          import re
          import sys
          from pathlib import Path

          new, old = map(Path, sys.argv[1:3])
          official = sys.argv[3] == 'official'

          def inspect(path):
              with path.open(encoding='utf-8-sig', newline='') as handle:
                  header = next(handle, '').rstrip('\r\n').split('\t')
                  if len(header) < 4 or re.sub(r'[^a-z]', '', header[0].lower()) != 'titleid':
                      raise ValueError(f'Invalid TSV header: {path}')
                  count = 0
                  for line in handle:
                      if not line.strip():
                          continue
                      if len(line.rstrip('\r\n').split('\t', 4)) < 4:
                          raise ValueError(f'Invalid TSV row: {path}')
                      count += 1
                  return count

          count = inspect(new)
          if official:
              previous = (count if filecmp.cmp(new, old, shallow=False) else inspect(old)) if old.exists() else 0
              if not count or count < previous * .85:
                  raise ValueError(f'Unexpected official catalog reduction: {new} ({previous} -> {count})')
          print(f'Validated {new}: {count} rows')
          PY
          }

          mkdir -p "$BASE_DIR/pending"
          mkdir -p "$LATEST_DIR"
          mkdir -p "$EVENTS_DIR/dlcs" "$EVENTS_DIR/avatars" "$EVENTS_DIR/themes"
          mkdir -p "$HELPER_DIR"

          categories=("games" "avatars" "demos" "dlcs" "themes")
          for cat in "${categories[@]}"; do
            echo "Processando $cat..."

            EVENT_DIR=""
            case "$cat" in
              dlcs|avatars|themes) EVENT_DIR="$EVENTS_DIR/$cat" ;;
            esac

            URL_OFFICIAL="https://nopaystation.com/tsv/PS3_${cat^^}.tsv"
            curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 "$URL_OFFICIAL" -o "nps_raw.tsv"

            clean_tsv "nps_raw.tsv" "nps_clean.tsv"
            validate_tsv "nps_clean.tsv" "$BASE_DIR/${cat}.tsv" official

            python "$PY_SCRIPT" "$BASE_DIR/${cat}.tsv" "nps_clean.tsv" "$LATEST_DIR/latest_${cat}.tsv" "$EVENT_DIR" "$cat" "official"
            if cmp -s "nps_clean.tsv" "$BASE_DIR/${cat}.tsv"; then
              rm "nps_clean.tsv"
            else
              mv "nps_clean.tsv" "$BASE_DIR/${cat}.tsv"
            fi
            rm "nps_raw.tsv"

            curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 "https://nopaystation.com/tsv/pending/PS3_${cat^^}.tsv" -o "p_raw.tsv"
            clean_tsv "p_raw.tsv" "p_clean.tsv"
            validate_tsv "p_clean.tsv" "$BASE_DIR/pending/${cat}.tsv" pending

            python "$PY_SCRIPT" "$BASE_DIR/pending/${cat}.tsv" "p_clean.tsv" "$LATEST_DIR/latest_${cat}.tsv" "$EVENT_DIR" "$cat" "pending"
            if cmp -s "p_clean.tsv" "$BASE_DIR/pending/${cat}.tsv"; then
              rm "p_clean.tsv"
            else
              mv "p_clean.tsv" "$BASE_DIR/pending/${cat}.tsv"
            fi
            rm "p_raw.tsv"
          done

          echo "Generating compact PS3 Classic child-content helper..."

          python - <<'PY'
          import csv
          from pathlib import Path

          base_dir = Path("resources/database/content/official")
          output = Path("resources/database/helpers/child_content_index.tsv")

          def clean_field(value):
              return str(value or "").replace("\t", " ").replace("\r", " ").replace("\n", " ").strip()

          def valid_title_id(value):
              value = clean_field(value).upper()
              return value if len(value) == 9 else ""

          def read_rows(path):
              with path.open("r", encoding="utf-8-sig", errors="replace", newline="") as handle:
                  for row in csv.reader(handle, delimiter="\t"):
                      yield row

          flags = {}
          license_candidates = []

          for row in read_rows(base_dir / "dlcs.tsv"):
              if not row:
                  continue

              title_id = valid_title_id(row[0])
              if not title_id:
                  continue

              flags.setdefault(title_id, set()).add("D")

              # Same compact data the Classic already extracts from dlcs.tsv
              # for its Missing Licenses matching.
              if len(row) < 6:
                  continue

              pkg_url = clean_field(row[3])
              if not pkg_url or pkg_url.upper() == "MISSING":
                  continue

              name = clean_field(row[2])
              content_id = clean_field(row[5])
              license_candidates.append((title_id, name, content_id))

          for filename, flag in (("avatars.tsv", "A"), ("themes.tsv", "T")):
              for row in read_rows(base_dir / filename):
                  if not row:
                      continue

                  title_id = valid_title_id(row[0])
                  if title_id:
                      flags.setdefault(title_id, set()).add(flag)

          output.parent.mkdir(parents=True, exist_ok=True)

          with output.open("w", encoding="utf-8", newline="\n") as handle:
              handle.write("# PS3 Classic child content index v1\n")
              handle.write("# I\\tTITLE_ID\\tFLAGS(D/A/T)\n")
              handle.write("# L\\tTITLE_ID\\tDLC_NAME\\tCONTENT_ID\n")

              for title_id in sorted(flags):
                  ordered_flags = "".join(flag for flag in "DAT" if flag in flags[title_id])
                  handle.write("I\t{}\t{}\n".format(title_id, ordered_flags))

              for title_id, name, content_id in license_candidates:
                  handle.write("L\t{}\t{}\t{}\n".format(title_id, name, content_id))

          print(
              "Generated {} | Title IDs: {} | DLC license candidates: {}".format(
                  output, len(flags), len(license_candidates)
              )
          )
          PY

          python .github/scripts/generate_base_game_index.py

      - name: Commit and Push changes
        id: publish
        run: |
          git config --global user.name "PS3-Pro Bot"
          git config --global user.email "bot@ps3pro.com"
          git add resources/database/content/official/*.tsv
          git add resources/database/content/official/pending/*.tsv
          git add resources/database/content/latest/*.tsv
          git add resources/database/content/events
          git add resources/database/helpers/child_content_index.tsv
          git add resources/database/helpers/base_game_index.tsv

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Auto-update: Synchronized with NoPayStation (Official & Pending)"
          published=false
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              published=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 3))"
              if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
                git fetch --unshallow origin main || exit 1
              else
                git fetch origin main || exit 1
              fi
              git rebase FETCH_HEAD || exit 1
            fi
          done
          if [ "$published" != true ]; then exit 1; fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Publish updated catalog without waiting for indexers
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"; then
            echo '::warning::Catalog committed; Pages build could not be requested.'
          fi

  refresh-game-updates:
    needs: update-database
    if: ${{ !cancelled() && needs.update-database.result == 'success' }}
    uses: ./.github/workflows/update_game_update.yml
    with:
      database_update: true
    permissions:
      contents: write
      pages: write

  refresh-covers:
    needs: [update-database, refresh-game-updates]
    if: ${{ !cancelled() && needs.update-database.result == 'success' }}
    uses: ./.github/workflows/update_covers_index.yml
    with:
      database_update: true
    permissions:
      contents: write
      pages: write

  refresh-artwork:
    needs: [update-database, refresh-covers]
    if: ${{ !cancelled() && needs.update-database.result == 'success' }}
    uses: ./.github/workflows/update_artwork_indexes.yml
    with:
      database_update: true
    permissions:
      contents: write
      pages: write

  refresh-franchises:
    needs: [update-database, refresh-artwork]
    if: ${{ !cancelled() && needs.update-database.result == 'success' }}
    uses: ./.github/workflows/update_franchises.yml
    with:
      database_update: true
    permissions:
      contents: write
      pages: write
    secrets: inherit

  refresh-metadata:
    needs: [update-database, refresh-franchises]
    if: ${{ !cancelled() && needs.update-database.result == 'success' }}
    uses: ./.github/workflows/update_game_metadata.yml
    with:
      database_update: true
    permissions:
      contents: write
      pages: write

  refresh-manuals:
    needs: [update-database, refresh-metadata]
    if: ${{ !cancelled() && needs.update-database.result == 'success' }}
    uses: ./.github/workflows/update_manual_indexes.yml
    with:
      database_update: true
    permissions:
      contents: write
      pages: write

  refresh-avatars:
    needs: [update-database, refresh-manuals]
    if: ${{ !cancelled() && needs.update-database.result == 'success' }}
    uses: ./.github/workflows/update_avatar_covers.yml
    with:
      database_update: true
    permissions:
      contents: write
      pages: write
      actions: write

  refresh-themes:
    needs: [update-database, refresh-avatars]
    if: ${{ !cancelled() && needs.update-database.result == 'success' }}
    uses: ./.github/workflows/update_theme_previews.yml
    with:
      database_update: true
    permissions:
      contents: write
      pages: write
      actions: write

  publish-pages:
    needs: [update-database, refresh-themes]
    if: ${{ !cancelled() && needs.update-database.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Request GitHub Pages build after all updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"; then
            echo '::warning::Updates finished; Pages build could not be requested.'
          fi
