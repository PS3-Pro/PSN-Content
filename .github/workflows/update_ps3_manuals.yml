name: Update Manuals Index

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Update PSN™ Database']
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ps3-manual-index
  cancel-in-progress: false

jobs:
  update-manuals:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check update cadence
        id: cadence
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = 'workflow_dispatch' ] || [ "$(date -u +%u)" = '7' ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout repository
        if: steps.cadence.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        if: steps.cadence.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore unified manual cache
        id: restore
        if: steps.cadence.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .cache/manual-index/
          key: manuals-unified-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: manuals-unified-v2-
      - name: Restore legacy PS3 scan state
        if: steps.cadence.outputs.run == 'true' && steps.restore.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v4
        with:
          path: .cache/ps3-manual-index/state.json
          key: ps3-manuals-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ps3-manuals-v2-
      - name: Index public game manuals
        id: index
        if: steps.cadence.outputs.run == 'true'
        continue-on-error: true
        run: python .github/scripts/build-manual-index.py resources/database/manuals
      - name: Commit and push validated indexes
        id: publish
        if: steps.cadence.outputs.run == 'true'
        run: |
          for platform in ps1 ps2 ps3 ps4 psp psvita; do
            index="resources/database/manuals/$platform.json"
            if [ -f "$index" ]; then git add -- "$index"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'PS3-Pro Bot'
          git config user.email 'bot@ps3pro.com'
          git commit -m 'Auto-update: game manuals index'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Save unified manual cache
        if: ${{ !cancelled() && steps.cadence.outputs.run == 'true' && steps.publish.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/manual-index/
          key: manuals-unified-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Report incomplete refresh
        if: steps.cadence.outputs.run == 'true' && steps.index.outcome == 'failure'
        run: exit 1
