name: Update Covers & Blacklist Index

on:
  workflow_call:
    inputs:
      database_update:
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'resources/database/covers/compressed/**'
      - 'resources/database/content/official/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-covers-index-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout PSN-Content
        uses: actions/checkout@v6
        with:
          path: PSN-Content
          ref: main
          fetch-depth: 1

      - name: Checkout Recently-Played-Games (Repositório de Hashes)
        uses: actions/checkout@v6
        with:
          repository: PS3-Pro/Recently-Played-Games
          path: Recently-Played-Games

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Generate Indexes & Blacklist
        shell: bash
        run: |
          cd PSN-Content
          covers=resources/database/covers
          tmp=$(mktemp "$covers/index.tsv.XXXXXX")
          trap 'rm -f "$tmp"' EXIT
          find "$covers/compressed" -maxdepth 1 -type f -name '*.JPG' -printf '%f\n' | sed 's/\.JPG$//g' | LC_ALL=C sort > "$tmp"
          if [ ! -s "$tmp" ]; then
            echo '::error::No compressed covers found; previous index preserved.'
            exit 1
          fi
          if ! cmp -s "$tmp" "$covers/index.tsv"; then mv "$tmp" "$covers/index.tsv"; fi
          
          node .github/scripts/generate_blacklist.js

      - name: Commit and Push
        id: publish
        run: |
          cd PSN-Content
          git config --global user.name "PS3-Pro Bot"
          git config --global user.email "bot@ps3pro.com"
          git add resources/database/covers/index.tsv resources/database/covers/blacklist.tsv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Auto-update: Covers and Blacklist indexes"
          published=false
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              published=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 3))"
              if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
                git fetch --unshallow origin main || exit 1
              else
                git fetch origin main || exit 1
              fi
              git rebase FETCH_HEAD || exit 1
            fi
          done
          if [ "$published" != true ]; then exit 1; fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Request GitHub Pages build
        if: ${{ !inputs.database_update && steps.publish.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"; then
            echo '::warning::Changes committed; Pages build could not be requested.'
          fi
