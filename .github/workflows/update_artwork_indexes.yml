name: Update Artwork Indexes

on:
  workflow_run:
    workflows: ['Update PSN™ Database']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-artwork-indexes
  cancel-in-progress: false

jobs:
  update-artwork:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore artwork caches
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            .cache/launchbox-index/
            .cache/libretro-index/
          key: artwork-index-v3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: artwork-index-v3-

      - name: Record restored cache state
        id: cache_before
        run: |
          mkdir -p .cache/launchbox-index .cache/libretro-index
          fingerprint=$(find .cache/launchbox-index .cache/libretro-index -type f -printf '%p %s %T@ %i\n' | LC_ALL=C sort | sha256sum | cut -d ' ' -f1)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Seed staging from published indexes
        run: |
          for provider in launchbox libretro; do
            mkdir -p "$RUNNER_TEMP/artwork-indexes/$provider"
            for index in "resources/database/$provider/"*.json; do
              if [ -f "$index" ]; then cp "$index" "$RUNNER_TEMP/artwork-indexes/$provider/"; fi
            done
          done

      - name: Download LaunchBox metadata
        run: |
          mkdir -p "$RUNNER_TEMP/artwork-indexes"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 \
            --connect-timeout 30 --max-time 600 \
            https://gamesdb.launchbox-app.com/Metadata.zip \
            -o "$RUNNER_TEMP/Metadata.zip"

      - name: Generate LaunchBox indexes
        run: |
          python .github/scripts/build-launchbox-index.py \
            "$RUNNER_TEMP/Metadata.zip" "$RUNNER_TEMP/artwork-indexes/launchbox"

      - name: Generate Libretro indexes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/build-libretro-index.py "$RUNNER_TEMP/artwork-indexes/libretro"

      - name: Validate indexes
        run: |
          python .github/scripts/validate-artwork-indexes.py \
            "$RUNNER_TEMP/artwork-indexes" resources/database

      - name: Detect cache changes
        id: cache_after
        if: ${{ !cancelled() && steps.cache_before.outcome == 'success' }}
        env:
          PREVIOUS: ${{ steps.cache_before.outputs.fingerprint }}
        run: |
          fingerprint=$(find .cache/launchbox-index .cache/libretro-index -type f -printf '%p %s %T@ %i\n' | LC_ALL=C sort | sha256sum | cut -d ' ' -f1)
          if [ "$fingerprint" != "$PREVIOUS" ] && { [ -f .cache/launchbox-index/manifest.json ] || [ -d .cache/libretro-index ]; }; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Save artwork caches
        if: ${{ !cancelled() && steps.cache_after.outputs.changed == 'true' }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            .cache/launchbox-index/
            .cache/libretro-index/
          key: artwork-index-v3-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit and Push changes
        id: publish
        env:
          DATABASE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "$DATABASE_HEAD_SHA" ] && [ "$(git rev-parse HEAD)" != "$DATABASE_HEAD_SHA" ]; then
            echo 'database_changed=true' >> "$GITHUB_OUTPUT"
          fi
          git config user.name "PS3-Pro Bot"
          git config user.email "bot@ps3pro.com"
          for provider in launchbox libretro; do
            mkdir -p "resources/database/$provider"
            for index in "$RUNNER_TEMP/artwork-indexes/$provider/"*.json; do
              target="resources/database/$provider/${index##*/}"
              if ! cmp -s "$index" "$target"; then
                cp "$index" "$target"
                git add -- "$target"
              fi
            done
          done
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m "Auto-update: LaunchBox and Libretro artwork indexes"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 3))"
              if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
                git fetch --unshallow origin main || exit 1
              else
                git fetch origin main || exit 1
              fi
              git rebase FETCH_HEAD || exit 1
            fi
          done
          exit 1

      - name: Request GitHub Pages build
        if: steps.publish.outputs.changed == 'true' || steps.publish.outputs.database_changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"; then
            echo '::warning::Indexes are committed, but Pages build could not be requested. Check Pages settings or wait for the next normal deployment.'
          fi
