name: Update Server Dependencies

on:
  schedule:
    # 04:00 UTC = 01:00 America/Sao_Paulo
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-server-dependencies
  cancel-in-progress: false

jobs:
  update-server-dependencies:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: resources/server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'resources/server/.node-version'
          cache: 'npm'
          cache-dependency-path: 'resources/server/package-lock.json'

      - name: Validate current server
        run: |
          npm ci --omit=dev
          node --check server.js

      - name: Update compatible dependencies
        run: |
          npm update --package-lock-only --omit=dev

      - name: Apply compatible security fixes
        continue-on-error: true
        run: |
          npm audit fix --package-lock-only --omit=dev

      - name: Validate updated dependency tree
        run: |
          rm -rf node_modules
          npm ci --omit=dev
          node --check server.js

      - name: Show dependency changes
        run: |
          npm outdated || true
          npm audit --omit=dev || true

      - name: Commit and push dependency updates
        working-directory: .
        shell: bash
        run: |
          git config --global user.name "PS3-Pro Bot"
          git config --global user.email "bot@ps3pro.com"

          git add resources/server/package.json resources/server/package-lock.json

          if git diff --cached --quiet; then
            echo "Server dependencies are already up to date."
          else
            git commit -m "Auto-update: Server dependencies"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Fail if vulnerabilities still remain
        run: |
          npm audit --omit=dev --audit-level=low
