name: Update Franchises
on:
  workflow_dispatch:
    inputs:
      full_refresh:
        description: Rebuild all IGDB metadata (ignore cache)
        type: boolean
        default: false
  workflow_run:
    workflows: ['Update PSN™ Database']
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: update-franchises-main
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore IGDB metadata cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            .cache/franchises-igdb-v1/games.json.gz
            .cache/franchises-igdb-v1/games.checkpoint.json.gz
          key: ${{ runner.os }}-franchises-igdb-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-franchises-igdb-v1-
      - name: Generate franchise index
        env:
          PSN_SECRETS_FILE: ${{ vars.PSN_SECRETS_FILE || 'resources/server/server-secrets.json' }}
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          FULL_REFRESH: ${{ inputs.full_refresh || false }}
        run: |
          args=()
          if [ "$FULL_REFRESH" = "true" ]; then args+=(--full-refresh); fi
          python .github/scripts/generate_franchises.py --diagnostics "$RUNNER_TEMP/franchise-diagnostics" "${args[@]}"
      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/franchise-diagnostics/summary.md" ]; then
            cat "$RUNNER_TEMP/franchise-diagnostics/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload franchise diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: franchise-diagnostics
          path: ${{ runner.temp }}/franchise-diagnostics/
          if-no-files-found: ignore
          retention-days: 14
      - name: Save IGDB metadata cache
        if: ${{ !cancelled() && hashFiles('.cache/franchises-igdb-v1/games.json.gz') != '' }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            .cache/franchises-igdb-v1/games.json.gz
            .cache/franchises-igdb-v1/games.checkpoint.json.gz
          key: ${{ runner.os }}-franchises-igdb-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Commit index only if changed
        run: |
          git config user.name 'PS3-Pro Bot'
          git config user.email 'bot@ps3pro.com'
          git add resources/database/helpers/franchises.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update franchise index'
          published=false
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              published=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 3))"
              if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
                git fetch --unshallow origin main || exit 1
              else
                git fetch origin main || exit 1
              fi
              git rebase FETCH_HEAD || exit 1
            fi
          done
          if [ "$published" != true ]; then exit 1; fi
